name: Build ShortVid APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    name: Build and verify APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install Gradle 8.13
        run: |
          set -e
          curl -fsSL https://services.gradle.org/distributions/gradle-8.13-bin.zip -o /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.13/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        run: |
          set -e
          gradle --no-daemon clean assembleDebug

      - name: Verify APK
        run: |
          set -e
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          sha256sum "$APK"
          unzip -t "$APK" >/dev/null

      - name: Publish verified APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          APK="app/build/outputs/apk/debug/app-debug.apk"
          TAG="build-${GITHUB_RUN_ID}"
          gh release create "$TAG" "$APK"             --title "ShortVid verified build ${GITHUB_RUN_NUMBER}"             --notes "Verified debug APK built from commit ${GITHUB_SHA}."