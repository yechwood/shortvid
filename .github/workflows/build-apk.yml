name: Build ShortPlay APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        run: |
          set -e
          git clone --depth 1 --branch "$GITHUB_REF_NAME" "https://x-access-token:$GITHUB_TOKEN@github.com/$GITHUB_REPOSITORY.git" .
          git checkout "$GITHUB_SHA"

      - name: Install Android platform
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"

      - name: Install Gradle 8.13
        run: |
          set -e
          curl -fsSL https://services.gradle.org/distributions/gradle-8.13-bin.zip -o /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.13/bin" >> "$GITHUB_PATH"

      - name: Build APK
        run: |
          set -e
          gradle --no-daemon clean assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Publish verified APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          APK="app/build/outputs/apk/debug/app-debug.apk"
          TAG="build-${GITHUB_RUN_ID}"
          TITLE="ShortVid build ${GITHUB_RUN_NUMBER}"
          BODY="Automated debug APK built from commit ${GITHUB_SHA}."
          RELEASE_JSON="$(curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases" \
            -d "$(jq -n --arg tag "$TAG" --arg name "$TITLE" --arg body "$BODY" '{tag_name:$tag,name:$name,body:$body,generate_release_notes:false}')")"
          UPLOAD_URL="$(printf '%s' "$RELEASE_JSON" | jq -r '.upload_url' | sed 's/{?name,label}$//')"
          test -n "$UPLOAD_URL" && test "$UPLOAD_URL" != "null"
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @"$APK" \
            "$UPLOAD_URL?name=ShortVid-debug.apk"
