name: ShortVid APK Builder

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build
        run: gradle --no-daemon clean assembleDebug
      - name: Verify APK
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          sha256sum "$APK"
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          TAG="verified-${GITHUB_RUN_ID}"
          gh release create "$TAG" "$APK" \
            --title "ShortVid verified APK ${GITHUB_RUN_NUMBER}" \
            --notes "Verified APK built from ${GITHUB_SHA}."
